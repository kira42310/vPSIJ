[project]
name = "vpsij"
version = "0.1.0"
description = "Python-based job schedulers interface"
readme = "README.md"
authors = [
    { email = "soratouch@hotmail.com" }
]
requires-python = ">=3.8"
dependencies = [ 'jinja2', 'grpcio', 'grpcio-tools', 'parallel-ssh' ]

[dependency-groups]
dev = [ "ruff>=0.17.6" ]

[project.scripts]
vpsij-updater = "vPSIJ.job_rpc_client:update"
vpsij-setup-client = "vPSIJ.setup_client:setup"
vpsij-setup-template = "vPSIJ.setup_template:setup"

[build-system]
requires = ["uv_build>=0.6.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vPSIJ"
module-root = ""

[tool.ruff]
target-version = "py38"
line-length = 88
# Exclude auto-generated gRPC code
extend-exclude = ["vPSIJ/*_pb2.py", "vPSIJ/*_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
